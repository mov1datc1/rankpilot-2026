name: Editorial contracts
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/contracts/*.test.cjs
      - run: pip install -r ai-engine/requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: ai-engine
