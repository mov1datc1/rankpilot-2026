name: Editorial contracts
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/contracts/editorial-development.test.cjs tests/contracts/lawyer-role.test.cjs tests/contracts/delivery-recovery.test.cjs tests/contracts/filing-details.test.cjs tests/contracts/client-legal-name.test.cjs tests/contracts/editorial-recovery.test.cjs tests/contracts/editorial-recovery-postgres.test.cjs tests/contracts/editorial-repair-queue.test.cjs tests/contracts/editorial-runner.test.cjs tests/contracts/editorial-supervisor.test.cjs tests/contracts/analysis-scope.test.cjs tests/contracts/audit-next-actions.test.cjs tests/contracts/letter-sections.test.cjs tests/contracts/repair-progress.test.cjs tests/contracts/source-review-wizard.test.cjs tests/contracts/studio-draft.test.cjs tests/contracts/contact-api.test.cjs
      - run: pip install -r ai-engine/requirements.txt
      - run: python -m unittest discover -s tests -p "test_editorial*.py"
        working-directory: ai-engine
        env:
          PYTHONPATH: .
